name: CI Build & Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-rules-freeze:
    name: Agent Rules Freeze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AGENT_RULES_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'agent-rules-change-approved') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Frozen Agent Rules
        shell: bash
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- AGENTS.md CLAUDE.md; then
            echo "No agent-rule changes detected."
            exit 0
          fi

          if [ "$AGENT_RULES_CHANGE_APPROVED" = "true" ]; then
            echo "Agent-rule changes are authorized by a human maintainer."
            exit 0
          fi

          echo "AGENTS.md and CLAUDE.md are frozen."
          echo "A human maintainer must explicitly approve the change and apply the agent-rules-change-approved label."
          exit 1

  docs-freeze:
    name: Docs Freeze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOCS_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-change-approved') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Frozen Documentation
        shell: bash
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- docs/; then
            echo "No docs changes detected."
            exit 0
          fi

          if [ "$DOCS_CHANGE_APPROVED" = "true" ]; then
            echo "Docs changes are authorized by a human maintainer."
            exit 0
          fi

          echo "The docs/ directory is frozen."
          echo "A human maintainer must explicitly approve the change and apply the docs-change-approved label."
          exit 1

  database-check:
    name: Database Migrations & pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase Stack
        run: supabase start

      - name: Rebuild The Database From Migrations Only
        run: supabase db reset --no-seed

      - name: Lint Database Functions
        run: supabase db lint --fail-on error

      - name: Run Security And Performance Advisors
        run: supabase db advisors --local --type all --fail-on error

      - name: Run pgTAP Database Tests Against Migrations Only
        run: supabase test db

      - name: Rebuild The Database With The Development Seed
        run: supabase db reset

      - name: Run pgTAP Database Tests With The Seed Applied
        run: supabase test db

      - name: Stop Local Supabase Stack
        if: always()
        run: supabase stop --no-backup

  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
