name: CI Build & Lint

on:
  push:
    branches:
      - main
      # Task branches run the same checks on every checkpoint, so a database
      # phase is proven against a real Postgres before the next one builds on
      # it. A push opens no pull request, so no review automation is triggered.
      - "agent/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-rules-freeze:
    name: Agent Rules Freeze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AGENT_RULES_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'agent-rules-change-approved') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Frozen Agent Rules
        shell: bash
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- AGENTS.md CLAUDE.md; then
            echo "No agent-rule changes detected."
            exit 0
          fi

          if [ "$AGENT_RULES_CHANGE_APPROVED" = "true" ]; then
            echo "Agent-rule changes are authorized by a human maintainer."
            exit 0
          fi

          echo "AGENTS.md and CLAUDE.md are frozen."
          echo "A human maintainer must explicitly approve the change and apply the agent-rules-change-approved label."
          exit 1

  docs-freeze:
    name: Docs Freeze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOCS_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-change-approved') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Frozen Documentation
        shell: bash
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- docs/; then
            echo "No docs changes detected."
            exit 0
          fi

          if [ "$DOCS_CHANGE_APPROVED" = "true" ]; then
            echo "Docs changes are authorized by a human maintainer."
            exit 0
          fi

          echo "The docs/ directory is frozen."
          echo "A human maintainer must explicitly approve the change and apply the docs-change-approved label."
          exit 1

  database-check:
    name: Database Migrations & pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        # Pin the version so the setup step never resolves the "latest"
        # release at runtime, which is subject to GitHub API rate limits.
        with:
          version: v2.117.0

      - name: Start Local Supabase Stack
        run: supabase start

      - name: Rebuild The Database From Migrations Only
        run: supabase db reset --no-seed

      - name: Lint Database Functions
        run: supabase db lint --fail-on error

      - name: Run Security And Performance Advisors
        run: supabase db advisors --local --type all --fail-on error

      - name: Run pgTAP Database Tests Against Migrations Only
        run: supabase test db

      - name: Rebuild The Database With The Development Seed
        run: supabase db reset

      - name: Run pgTAP Database Tests With The Seed Applied
        run: supabase test db

      # The backend's Row Level Security enforcement can only be proved against
      # a real database: these tests ask, as one learner, for another learner's
      # rows, with no authorization check in the code path at all.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Backend Database Integration Tests
        working-directory: backend
        env:
          MATHSMART_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pytest -m integration

      - name: Stop Local Supabase Stack
        if: always()
        run: supabase stop --no-backup

  backend-check:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Linter
        working-directory: backend
        run: ruff check .

      - name: Run Unit Tests
        working-directory: backend
        run: pytest -m "not integration"

  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
