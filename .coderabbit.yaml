language: en-US

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  changed_files_summary: true
  review_status: true
  review_progress: true
  fail_commit_status: true
  poem: false
  enable_prompt_for_ai_agents: true

  # Both slices of the first read are done, so the filter is back to excluding
  # only what is not source. The remaining rounds are incremental: they read the
  # commits pushed since the last review, which is far below the hundred-file
  # limit that forced the slicing.
  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!dist/**"
    - "!build/**"
    - "!coverage/**"
    - "!package-lock.json"

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
